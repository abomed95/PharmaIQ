# PharmaIQ — pipeline Cloud Build : tests → image → Artifact Registry → migrations → Cloud Run.
#
# Lancement (voir DEPLOY.md pour les prérequis) :
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_SUPABASE_URL=https://xxxx.supabase.co,_SUPABASE_ANON_KEY=eyJ...,_APP_URL=https://app.exemple.dj
#
# Aucun secret dans ce fichier : ils sont lus dans Secret Manager.
substitutions:
  _REGION: europe-west1
  _REPOSITORY: pharmaiq
  _SERVICE: pharmaiq-web
  _SERVICE_ACCOUNT: pharmaiq-run
  # Valeurs PUBLIQUES incrustées au build (elles finissent dans le navigateur).
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''
  _APP_URL: ''
  # true = applique les migrations Prisma et la RLS avant de déployer.
  _RUN_MIGRATIONS: 'true'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # 1. Typage et tests unitaires : rien n'est construit si la base de code est cassée.
  - id: tests
    name: node:22-bookworm-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl >/dev/null
        corepack enable
        pnpm install --frozen-lockfile
        pnpm db:generate
        pnpm typecheck
        pnpm test

  # 2. Image de production (multi-étapes, utilisateur non-root).
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:latest
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - --build-arg=NEXT_PUBLIC_APP_URL=${_APP_URL}
      - .

  # 3. Publication dans Artifact Registry.
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web']

  # 4. Migrations + RLS, AVANT de servir du trafic avec le nouveau code.
  #    Une table sans politique RLS est une fuite : db:rls est rejoué à chaque fois.
  - id: migrations
    name: node:22-bookworm-slim
    entrypoint: bash
    secretEnv: [DIRECT_URL]
    args:
      - -ceu
      - |
        if [ "${_RUN_MIGRATIONS}" != "true" ]; then echo "Migrations ignorées."; exit 0; fi
        apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl >/dev/null
        corepack enable
        pnpm install --frozen-lockfile
        export DATABASE_URL="$$DIRECT_URL"
        pnpm --filter @pharmaiq/db run deploy
        pnpm db:rls

  # 5. Déploiement SANS trafic : la révision est vérifiée avant de recevoir les utilisateurs.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com
      - --no-traffic
      - --tag=candidat
      - --quiet

  # 6. Sonde de santé sur la révision candidate, puis bascule du trafic.
  - id: bascule
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        url=$(gcloud run services describe ${_SERVICE} --region=${_REGION} \
              --format='value(status.traffic.filter("tag","candidat").url)' | head -1)
        echo "Révision candidate : $url"
        curl --fail --silent --show-error --max-time 30 "$url/api/health?deep=1"
        gcloud run services update-traffic ${_SERVICE} --region=${_REGION} --to-latest --quiet

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/pharmaiq-direct-url/versions/latest
      env: DIRECT_URL

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:latest

timeout: 1800s
