# Construit et publie l'image du PREMIER déploiement (appelé par first-deploy.sh).
#
# Pourquoi un fichier à part : les valeurs NEXT_PUBLIC_* doivent être passées au
# build (`gcloud builds submit --tag` ne le permet pas), et cloudbuild.yaml
# déploie sans trafic une révision d'un service qui doit déjà exister.
# Aucun secret ici : ces trois valeurs sont publiques (elles finissent dans le navigateur).
substitutions:
  _IMAGE: ''
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''
  _APP_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - --build-arg=NEXT_PUBLIC_APP_URL=${_APP_URL}
      - .

images:
  - ${_IMAGE}

timeout: 1800s
